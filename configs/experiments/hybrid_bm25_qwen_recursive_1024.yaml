# Experiment: Hybrid BM25 + Qwen3-8B dense retrieval with RRF fusion
# (no reranker — use hybrid_bm25_qwen_kanon2rerank_recursive_1024.yaml for the reranked version)
#
# Indexing builds both a FAISS index (Qwen embeddings) and a BM25 index from
# the same chunks.  At query time the two ranked lists are fused with RRF.
#
# The Qwen embedder is shared with qwen_recursive_1024 so both experiments
# can reuse the same FAISS index; run_indexing.py will also write a .bm25.pkl
# alongside it when the retriever type is HybridRetriever.
base_config: ../../configs/base.yaml

experiment_id: hybrid_bm25_qwen_recursive_1024_1k-docs
description: "Hybrid BM25+Qwen3-8B retrieval (RRF fusion), recursive 1024-char chunks, 1000-doc corpus"

dataset:
  max_docs: 1000

chunker:
  type: chunkers.recursive.RecursiveChunker
  max_chunk_chars: 1024
  overlap_chars: 128

embedder:
  type: embedders.qwen.QwenEmbedder
  model_name: Qwen/Qwen3-Embedding-8B
  device: cuda:0
  batch_size: 16

retriever:
  type: retrievers.hybrid_retriever.HybridRetriever
  metric: cosine
  bm25_k1: 1.5
  bm25_b: 0.75
  rrf_k: 60

evaluation:
  k_values: [3, 5, 10, 20, 50]
  metrics:
    - recall_at_k
    - doc_recall_at_k
    - hit_at_k
    - mrr
    - ndcg_at_k

indexing:
  document_batch_size: 10
  embedding_batch_size: 16
  save_intermediate_every: 50

logging:
  level: DEBUG
