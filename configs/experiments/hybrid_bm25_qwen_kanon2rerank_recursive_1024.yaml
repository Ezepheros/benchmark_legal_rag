# Experiment: Hybrid BM25 + Qwen3-8B dense retrieval → Kanon2 reranker
#
# Two-stage pipeline:
#   Stage 1 — Wide retrieval: union of FAISS top-N and BM25 top-N candidates
#   Stage 2 — Reranking: Kanon2 cross-encoder scores every candidate against
#             the raw query text and returns the top-k most relevant chunks
#
# Requires: ISAACUS_API_KEY (for Kanon2Reranker)
# Kanon2 reranker pricing: $0.35 per million tokens
# Use max_cost_usd to cap spend during experiments.
base_config: ../../configs/base.yaml

experiment_id: hybrid_bm25_qwen_kanon2rerank_recursive_1024_1k-docs
description: "Hybrid BM25+Qwen3-8B retrieval + Kanon2 reranker, recursive 1024-char chunks, 1000-doc corpus"

dataset:
  max_docs: 1000

chunker:
  type: chunkers.recursive.RecursiveChunker
  max_chunk_chars: 1024
  overlap_chars: 128

embedder:
  type: embedders.qwen.QwenEmbedder
  model_name: Qwen/Qwen3-Embedding-8B
  device: cuda:0
  batch_size: 16

retriever:
  type: retrievers.hybrid_retriever.HybridRetriever
  metric: cosine
  bm25_k1: 1.5
  bm25_b: 0.75

reranker:
  type: rerankers.kanon2.Kanon2Reranker
  model_name: kanon-2-reranker
  batch_size: 100
  # max_cost_usd: 5.00   # uncomment to cap spend per run

evaluation:
  k_values: [3, 5, 10, 20, 50]
  metrics:
    - recall_at_k
    - doc_recall_at_k
    - hit_at_k
    - mrr
    - ndcg_at_k

indexing:
  document_batch_size: 10
  embedding_batch_size: 16
  save_intermediate_every: 50

logging:
  level: DEBUG
