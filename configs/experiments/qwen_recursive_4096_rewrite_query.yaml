# Experiment: Qwen3-8B + recursive 4096-char chunking + query rewriting
base_config: ../../configs/base.yaml

experiment_id: qwen_recursive_4096_rewrite_query_1k-docs
description: "Qwen3-8B embedder, recursive 4096-char chunks, Gemini query rewriting"

dataset:
  max_docs: 1000

chunker:
  type: chunkers.recursive.RecursiveChunker
  max_chunk_chars: 4096
  overlap_chars: 256

embedder:
  type: embedders.qwen.QwenEmbedder
  model_name: Qwen/Qwen3-Embedding-8B
  device: cuda:0
  batch_size: 16

query_rewriter:
  type: rewriters.gemini_rewriter.GeminiQueryRewriter
  model_name: gemini-2.5-flash

evaluation:
  k_values: [3, 5, 10, 20, 50]
  metrics:
    - recall_at_k
    - doc_recall_at_k
    - hit_at_k
    - mrr
    - ndcg_at_k

indexing:
  document_batch_size: 10
  embedding_batch_size: 16
  save_intermediate_every: 50

logging:
  level: DEBUG
